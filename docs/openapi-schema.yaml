components:
  schemas:
    AccountStatusEnum:
      enum:
      - pending
      - active
      - suspended
      - deactivated
      type: string
      description: '* `pending` - Pending

        * `active` - Active

        * `suspended` - Suspended

        * `deactivated` - Deactivated'
    Achievement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        icon_url:
          type: string
          format: uri
          readOnly: true
        xp_reward:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - icon_url
      - id
      - is_active
      - slug
      - title
      - updated_at
      - xp_reward
    ActivityFeedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        recipient:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        verb:
          allOf:
          - $ref: '#/components/schemas/VerbEnum'
          readOnly: true
        post:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        visibility_snapshot:
          allOf:
          - $ref: '#/components/schemas/VisibilitySnapshotEnum'
          readOnly: true
        payload:
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - created_at
      - id
      - is_read
      - payload
      - post
      - recipient
      - updated_at
      - verb
      - visibility_snapshot
    ActivityTypeEnum:
      enum:
      - study
      - test_practice
      - review
      - flashcard
      - lecture
      - project
      - break
      type: string
      description: '* `study` - Study

        * `test_practice` - Test practice

        * `review` - Review

        * `flashcard` - Flashcard

        * `lecture` - Lecture

        * `project` - Project

        * `break` - Break'
    AdminAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserPublic'
          readOnly: true
        action:
          type: string
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - ip_address
      - metadata
      - target_id
      - target_type
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          title: نام کاربری
          description: الزامی. 150 کاراکتر یا کمتر. فقط شامل حروف، اعداد، و علامات
            @/./+/-/_
        email:
          type: string
          format: email
          readOnly: true
          title: آدرس ایمیل
        display_name:
          type: string
          readOnly: true
        account_status:
          allOf:
          - $ref: '#/components/schemas/AccountStatusEnum'
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatus6a4Enum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: تاریخ پیوستن
      required:
      - account_status
      - date_joined
      - display_name
      - email
      - id
      - username
      - verification_status
